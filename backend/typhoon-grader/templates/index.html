<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบตรวจข้อสอบ OMR (OpenCV)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">📄 ระบบตรวจข้อสอบ OMR (OpenCV)</h2>

    <!-- ฟอร์มอัปโหลด -->
    <form id="uploadForm" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="file" class="form-label">เลือกไฟล์ภาพกระดาษคำตอบ (JPG/PNG)</label>
        <input type="file" class="form-control" id="file" name="file" accept=".jpg,.jpeg,.png" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">อัปโหลดและตรวจข้อสอบ</button>
    </form>

    <!-- ปุ่มลิงก์ -->
    <div class="text-center mt-3">
      <a href="/set_answer_key" class="btn btn-warning btn-sm">ตั้งค่าเฉลย</a>
    </div>

    <!-- พื้นที่แสดงผล -->
    <div id="result" class="mt-5" style="display:none;">
      <div class="card shadow-sm p-4">
        <h4 class="mb-3">📊 ผลการตรวจ</h4>
        <div id="errorMsg"></div>
        <p><strong>รหัสนักเรียน:</strong> <span id="studentId"></span></p>
        <h5>คำตอบที่ตรวจได้</h5>
        <div id="answers" class="row row-cols-2 row-cols-md-4 g-2"></div>

        <hr>
        <h5>🖼 Debug Image</h5>
        <img id="debugImage" src="" class="img-fluid border rounded" alt="Debug Image">
      </div>
    </div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function(e){
      e.preventDefault();
      const fileInput = document.getElementById("file");
      if(!fileInput.files.length) return;
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      const res = await fetch("/grade", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      document.getElementById("result").style.display = "block";
      const errorMsg = document.getElementById("errorMsg");
      if(data.error){
        errorMsg.innerHTML = `<div class='alert alert-danger'>ข้อผิดพลาด: ${data.error}</div>`;
        document.getElementById("studentId").textContent = "-";
        document.getElementById("answers").innerHTML = "";
        document.getElementById("debugImage").src = "";
        return;
      } else {
        errorMsg.innerHTML = "";
      }
      document.getElementById("studentId").textContent = data.student_id || "UNKNOWN";
      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      // Loop Q1 - Q80
      for(let i = 1; i <= 80; i++){
        const q = `Q${i}`;
        const ans = data.answers[q] || "N/A";
        const el = document.createElement("div");
        el.className = "col"; 
        el.innerHTML = `<div class="p-2 border rounded bg-white small">${q}: <strong>${ans}</strong></div>`;
        answersDiv.appendChild(el);
      }

      if(data.debug_image){
        document.getElementById("debugImage").src = data.debug_image;
      }
    });
  </script>
</body>
</html>
